<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZooCell Symposium Speakers</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            background-color: #d5cdd9; /* Замените на цвет фона вашего макета, если он не белый */        
        }
        body {
            width: 100%;
            min-height:100vh;
            min-height: 100dvh; /* Учитывает панель адреса в мобильном браузере */
            /*overflow-x: hidden; */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #d5cdd9;
        }
        img {
            width: 100vw; /* Строго 100% ширины экрана, не сожмется */
            max-width: 100%; 
            height: auto;
            display: block;
            /*margin: auto */
        }
    </style>
</head>
<body>

    <img src="speakers.svg" alt="Conference Speakers">

</body>
</html>
